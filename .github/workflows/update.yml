name: Update sunset forecast

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sunset-forecast-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate forecast
        run: |
          python --version
          python generate.py
          grep -q "資料更新中" index.html && echo "Warning: one or more locations failed" || true
      - name: Commit forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update regional sunset forecast"
            git push
          fi
