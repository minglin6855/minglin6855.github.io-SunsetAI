name: Update sunset forecast

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Runs hourly at minute 17.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sunset-forecast-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate static page
        run: python generate.py

      - name: Commit changed forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No forecast change."
          else
            git commit -m "chore: update sunset forecast"
            git push
          fi
