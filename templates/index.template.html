<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="{{REFRESH_SECONDS}}">
  <meta name="theme-color" content="#0a101b">
  <title>{{SITE_TITLE}}｜{{TARGET_DATE}}</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="app">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">☼</div>
      <div>
        <p class="eyebrow">SUNSET FORECAST</p>
        <h1>{{SITE_TITLE}}</h1>
        <p class="subtitle">{{SITE_SUBTITLE}}</p>
      </div>
      <div class="date-chip">
        <span>預報日期</span>
        <strong>{{TARGET_DATE}}</strong>
      </div>
    </header>

    <section class="intro-card">
      <div>
        <p class="intro-label">選擇觀測區域</p>
        <h2>今晚哪裡最有機會？</h2>
      </div>
      <span class="no-js">HTML＋CSS</span>
    </section>

    <section class="region-selector">
      {{REGION_CONTROLS}}
    </section>

    {{REGION_PANELS}}

    <footer>
      <p>資料來源：Open-Meteo</p>
      <p>ECMWF IFS 0.25°／GFS Global／DWD ICON Global</p>
      <p>更新：{{UPDATED_TIME}}（Asia/Taipei）</p>
      <p class="fine-print">信心指數代表三模式一致程度，不等於實際發生機率。前端未使用 JavaScript。</p>
    </footer>
  </main>
</body>
</html>
